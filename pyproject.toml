[project]
name = "eh1-grader"
version = "0.1.0"
description = "EH-1's engine: grades DuckDB analytics agent runs from their traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The agent's package: the traces connection (and its server), sources, pricing.
    "duck-harness",
    "anthropic>=1.5.0",
    "duckdb>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# The app protocol (JSON Lines on stdin/stdout); see eh1_grader/serve.py.
eh1-serve = "eh1_grader.serve:main"
# Grade a setlist from the command line and print the scorecard.
eh1-grade = "eh1_grader.cli:main"

[tool.uv.sources]
# Development: the agent checkout next to this one, as DH-1's app expects too.
duck-harness = { path = "../duckdb-analytics-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eh1_grader"]

[dependency-groups]
dev = ["pytest>=9.1.1"]
